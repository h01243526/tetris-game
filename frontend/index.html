<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>俄罗斯方块 - 登录</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">TETRIS 俄罗斯方块</div>
      <div class="auth-sub">基于 Flask + HTML5 Canvas 的网页游戏</div>

      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">登 录</div>
        <div class="auth-tab" data-tab="register">注 册</div>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label>用户名</label>
          <input class="input" id="loginUsername" placeholder="请输入用户名" maxlength="20">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="input" id="loginPassword" type="password" placeholder="请输入密码" maxlength="20">
        </div>
        <div class="auth-msg" id="loginMsg"></div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" autocomplete="off" style="display:none;">
        <div class="form-group">
          <label>用户名</label>
          <input class="input" id="regUsername" placeholder="3~20 位字母、数字、下划线或汉字" maxlength="20">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="input" id="regPassword" type="password" placeholder="6~20 位密码" maxlength="20">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input class="input" id="regConfirm" type="password" placeholder="请再次输入密码" maxlength="20">
        </div>
        <div class="auth-msg" id="regMsg"></div>
        <button type="submit" class="btn btn-magenta btn-block">注 册</button>
      </form>

      <div class="auth-tip">游客可浏览 <a href="/leaderboard.html">排行榜</a>，登录后即可开始对局并保存成绩</div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
