<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 俄罗斯方块</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="container">
    <h1 class="page-title">用户账号管理</h1>

    <div id="denied" class="card hidden" style="text-align:center;padding:60px 20px;">
      <h3 style="justify-content:center;">403 无访问权限</h3>
      <p style="color:var(--text-dim);margin:10px 0 18px;">本页面仅管理员可访问</p>
      <a class="btn btn-primary" href="/game.html">返回游戏</a>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="toolbar">
        <input class="input" id="keyword" placeholder="按用户名 / 昵称搜索">
        <button class="btn btn-primary btn-sm" id="searchBtn">搜索</button>
        <button class="btn btn-ghost btn-sm" id="resetBtn">重置</button>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>ID</th><th>用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>注册时间</th><th>最后登录</th><th>操作</th></tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="usersEmpty">没有符合条件的用户</div>
        <div class="pagination">
          <button class="btn btn-ghost btn-sm" id="prevPage">上一页</button>
          <span id="pageInfo">1 / 1</span>
          <button class="btn btn-ghost btn-sm" id="nextPage">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
